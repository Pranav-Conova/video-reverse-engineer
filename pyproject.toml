[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editast"
version = "0.1.0"
description = "Video Reverse Engineer: reverse-engineer any viral video edit (TikTok, Reels, Shorts, trailers) into an Abstract Syntax Tree, and re-render it with your own footage and music."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pranav T" }]
keywords = [
    "reverse-engineering", "video-editing", "video-analysis", "computer-vision",
    "beat-detection", "bpm-detection", "beat-sync", "music-video-sync",
    "shot-boundary-detection", "scene-detection", "transition-detection",
    "speed-ramp", "camera-motion", "ocr", "captions", "edit-template",
    "video-template", "auto-editing", "ast", "abstract-syntax-tree",
    "tiktok", "youtube-shorts", "instagram-reels", "short-form-video",
    "velocity-edit", "capcut", "ffmpeg", "opencv",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
    "pydantic>=2.6",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/Pranav-Conova/video-reverse-engineer"
Repository = "https://github.com/Pranav-Conova/video-reverse-engineer"
Documentation = "https://github.com/Pranav-Conova/video-reverse-engineer#readme"
Issues = "https://github.com/Pranav-Conova/video-reverse-engineer/issues"
Examples = "https://github.com/Pranav-Conova/video-reverse-engineer/tree/main/examples"

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
fetch = ["yt-dlp"]
dev = ["pytest>=8"]

[project.scripts]
editast = "editast.cli:main"

[tool.setuptools.packages.find]
include = ["editast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
